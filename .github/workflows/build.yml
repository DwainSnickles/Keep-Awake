name: Build

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build in Release
        run: dotnet build KeepAwake.csproj -c Release --nologo

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: KeepAwake-release
          path: bin/Release/net8.0-windows/
          if-no-files-found: error

  release:
    # Only a version tag publishes: v1.0.0, v1.2.3, and so on.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish the self-contained single file
        run: >-
          dotnet publish KeepAwake.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o dist/publish

      - name: Zip the portable build and write its checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist/publish/* -DestinationPath dist/Keep-Awake-win-x64.zip -Force
          $hash = (Get-FileHash dist/Keep-Awake-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path dist/Keep-Awake-win-x64.zip.sha256 -Value "$hash  Keep-Awake-win-x64.zip" -Encoding ascii
          Write-Output "SHA-256 $hash"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Keep Awake ${{ github.ref_name }}
          files: |
            dist/Keep-Awake-win-x64.zip
            dist/Keep-Awake-win-x64.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
